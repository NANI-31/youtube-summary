<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Border & Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Summary Wave Lines Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle Corner Highlights -->
  <rect x="4" y="4" width="56" height="28" rx="14" fill="url(#borderGrad)" opacity="0.08"/>

  <!-- Open Notebook Pages -->
  <!-- Left Page -->
  <path d="M20 18 H31 C32 18 32 46 31 46 H20 C18 46 17 44 17 42 V22 C17 20 18 18 20 18 Z" 
        stroke="url(#borderGrad)" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity="0.75"/>
  <!-- Right Page -->
  <path d="M33 18 H44 C46 18 47 20 47 22 V42 C47 44 46 46 44 46 H33 C32 46 32 18 33 18 Z" 
        stroke="url(#borderGrad)" stroke-width="1.8" stroke-linejoin="round" fill="none" opacity="0.75"/>

  <!-- Left Page Lines -->
  <line x1="21" y1="24" x2="28" y2="24" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="21" y1="29" x2="27" y2="29" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="21" y1="34" x2="28" y2="34" stroke="#71717a" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Right Page Summary Lines (AI Waves) -->
  <line x1="36" y1="24" x2="43" y2="24" stroke="url(#waveGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M35 32 Q38 29, 41 33 T45 31" stroke="url(#waveGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <line x1="36" y1="40" x2="42" y2="40" stroke="url(#waveGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center Glowing Play Triangle -->
  <polygon points="28,26 40,32 28,38" fill="url(#playGrad)" filter="url(#glow)"/>
</svg>